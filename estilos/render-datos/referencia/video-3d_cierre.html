<!doctype html><html lang="es"><head><meta charset="utf-8"><style>
@font-face{font-family:"Cormorant";src:url(fonts/cormorant-garamond-latin-600-normal.woff2);font-weight:600}
@font-face{font-family:"Jost";src:url(fonts/jost-latin-400-normal.woff2);font-weight:400}
@font-face{font-family:"Jost";src:url(fonts/jost-latin-500-normal.woff2);font-weight:500}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden}
body{background:radial-gradient(ellipse at 50% 30%,#3a2d2a 0%,#2a211f 60%,#1f1817 100%);color:#f6eee4;font-family:"Jost",sans-serif}
#logo{position:absolute;top:90px;left:50%;width:230px;transform:translateX(-50%)}
h1{position:absolute;top:215px;left:0;right:0;text-align:center;font-family:"Cormorant",serif;font-weight:600;font-size:84px;font-variant-numeric:lining-nums}
#paper{position:absolute;left:50%;top:350px;width:520px;margin-left:-260px;transform:rotate(-3deg);box-shadow:0 30px 70px rgba(0,0,0,.55);border-radius:10px;overflow:hidden;background:#fff}
#paper img{display:block;width:100%}
.badge{position:absolute;font-weight:500;letter-spacing:.05em;border-radius:999px}
#gratis{right:120px;top:330px;background:#e8a095;color:#2a211f;font-size:40px;padding:14px 38px;transform:rotate(6deg)}
#pdf{right:105px;top:1030px;background:#f6eee4;color:#2a211f;font-size:34px;padding:12px 32px;transform:rotate(-5deg)}
ul{position:absolute;top:1130px;left:0;right:0;list-style:none;text-align:center;font-size:44px;line-height:1.55}
li b{color:#e8a095;font-weight:500;margin-right:14px}
#pill{position:absolute;top:1360px;left:50%;transform:translateX(-50%);white-space:nowrap;font-weight:500;font-size:76px;letter-spacing:.04em;color:#2a211f;background:#e8a095;border-radius:999px;padding:20px 58px}
#sub{position:absolute;top:1495px;left:0;right:0;text-align:center;font-size:38px;color:rgba(246,238,228,.7)}
#ia{position:absolute;bottom:60px;left:0;right:0;text-align:center;font-size:22px;color:rgba(246,238,228,.35)}
</style></head><body>
<img id="logo" src="levania_logo_blanco.png">
<h1>Esto es lo que te llega</h1>
<div id="paper"><img src="checklist_prev.png"></div>
<div class="badge" id="gratis">GRATIS</div>
<div class="badge" id="pdf">PDF para imprimir</div>
<ul><li><b>✓</b>Antes de la escuela</li><li><b>✓</b>Después de la escuela</li><li><b>✓</b>Antes de dormir</li></ul>
<div id="pill">Comenta RUTINA</div>
<div id="sub">y te lo mando por mensaje privado</div>
<div id="ia">Animación creada con apoyo de IA</div>
</body></html>
