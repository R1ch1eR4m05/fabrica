<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Reflexión · Estatuas</title>
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block;width:100vw;height:100vh;object-fit:contain}</style>
</head><body><canvas id="lienzo"></canvas>
<script src="../_comun/motor.js"></script>
<script>
// Reflexión · Estatuas: cada escena es una imagen (o clip) pintada de un solo tono, con acercamiento lento,
// y el texto aparece palabra por palabra en letra romana: bloques de 3-6 palabras que se encienden al decirse, la palabra clave en color de acento
// (opción "Subtítulos → Frase completa": el estilo anterior, la frase entera tenue).
// En cada punto o signo de pregunta el texto se limpia. Sello del canal al centro, polvo flotando.
const F = "../_comun/fuentes/";
const TONOS = { turquesa: "#3fb2a3", ambar: "#d49a5a", plata: "#9a9a9a", rojo: "#b5473a" };
let info = [], directas = [], mascaras = [], capa = null, muestra = null, lugares = new Map(), escenasVistas = new Set(), escenasEncima = new Set(), cache = new Map(), actual = null, tono = TONOS.turquesa, conLogo = true, sello = "", oscuro = true;

Motor.inicioVoz = 0.3;
Motor.iniciar({
  fuentes: [["Cinzel", F + "cinzel-latin-700-normal.woff2", { weight: "700" }], ["Cinzel", F + "cinzel-latin-800-normal.woff2", { weight: "800" }], ["Montserrat", F + "montserrat-latin-800-normal.woff2", { weight: "800" }]],
  async preparar(M) {
    const op = M.proyecto.opciones || {};
    tono = TONOS[op.tono] || TONOS.turquesa; conLogo = op.logo !== "no";
    oscuro = op.contraste !== "claro"; // nov 2026: a Monarca le fue mejor con los videos más oscuros y contrastados
    sello = op.logo === "canal" ? String(M.proyecto.canal || M.guion.canal || "").replace(/^@/, "").trim() || "M" : "M"; // Monarca
    try { const r = await fetch(`/proyectos/${encodeURIComponent(M.proyecto.id)}/clips/historia.json?v=${Date.now()}`); if (r.ok) info = await r.json(); } catch {}
    // texto detrás de la estatua: máscara de cada escena (la hace prepararHistoria con core/recorte.js)
    if (op.profundidad !== "encima") await Promise.all(info.map(async (x, i) => {
      if (!x || !x.mascara) return;
      try { const r = await fetch(`/proyectos/${encodeURIComponent(M.proyecto.id)}/clips/${x.n}/mascara.png`); if (r.ok) mascaras[i] = await createImageBitmap(await r.blob()); } catch {}
    }));
    // vista previa en el panel: las imágenes que aún no se han preparado (recién salidas de Flow, del banco o subidas)
    // se cargan directo; al sacar el video se preparan bien (historia.json)
    try {
      const r = await fetch(`/api/proyectos/${encodeURIComponent(M.proyecto.id)}?v=${Date.now()}`);
      if (r.ok) { const d = await r.json();
        await Promise.all((d.clips || []).map(async (x, i) => {
          if (!x.archivo || !/\.(jpe?g|png|webp)$/i.test(x.archivo)) return;
          try { const b = await (await fetch(`/proyectos/${encodeURIComponent(M.proyecto.id)}/clips/${encodeURIComponent(x.archivo)}?v=${Date.now()}`)).blob(); directas[i] = await createImageBitmap(b); } catch {}
        }));
      }
    } catch {}
    M.antesDeDibujar = async (t) => {
      const i = M.escenaEn(t), c = info[i]; actual = directas[i] || null;
      if (actual || !c || c.tipo === "ninguno" || !c.frames) return;
      const k = c.tipo === "video" ? Math.min(c.frames - 1, Math.max(0, Math.floor((t - M.tiempos.escenas[i].ini) * c.fps))) : 0;
      actual = await cuadro(M, i + 1, k);
      if (c.tipo === "video") for (let j = 1; j <= 3; j++) if (k + j < c.frames) cuadro(M, i + 1, k + j);
    };
  },

  dibujar(c, t, M) {
    const W = M.W, H = M.H, u = M.u;
    const i = M.escenaEn(t), te = M.tiempos.escenas[i], p = t - te.ini, d = Math.max(1, te.fin - te.ini);

    // ---- la imagen, con acercamiento lento (cada escena hacia un lado) ----
    c.fillStyle = "#050807"; c.fillRect(0, 0, W, H);
    c.save();
    const z = camara(c, M, t, i, p, d);
    if (oscuro) c.filter = "brightness(0.74) contrast(1.38)"; // oscuro: medios abajo y sombras profundas; las luces de la estatua siguen brillando
    if (actual) cubrir(c, actual, W, H); else niebla(c, M, t, i);
    c.filter = "none";
    c.restore();

    // ---- un solo tono: sin color, teñido y con contraste ----
    c.save();
    c.globalCompositeOperation = "saturation"; c.fillStyle = "#808080"; c.fillRect(0, 0, W, H);
    c.globalCompositeOperation = "color"; c.fillStyle = tono; c.fillRect(0, 0, W, H);
    // oscuro: sombras profundas y más contraste (luces altas intactas); claro: levanta las sombras para que se vea más en el feed
    c.globalCompositeOperation = "soft-light"; c.fillStyle = oscuro ? "#404040" : "#5a5a5a"; c.fillRect(0, 0, W, H);
    if (!oscuro) { c.globalCompositeOperation = "screen"; c.globalAlpha = 0.14; c.fillStyle = tono; c.fillRect(0, 0, W, H); c.globalAlpha = 1; }
    c.restore();
    const g = c.createLinearGradient(0, 0, 0, H); g.addColorStop(0, `rgba(0,0,0,${oscuro ? 0.4 : 0.22})`); g.addColorStop(0.45, "rgba(0,0,0,0)"); g.addColorStop(1, `rgba(0,0,0,${oscuro ? 0.6 : 0.35})`);
    c.fillStyle = g; c.fillRect(0, 0, W, H);
    const v = c.createRadialGradient(W / 2, H * 0.45, H * 0.22, W / 2, H * 0.45, H * 0.8); v.addColorStop(0, "rgba(0,0,0,0)"); v.addColorStop(1, `rgba(0,0,0,${oscuro ? 0.62 : 0.35})`);
    c.fillStyle = v; c.fillRect(0, 0, W, H);

    if (i === 0 && t < 1.9) barrido(c, W, H, t);
    polvo(c, M, t);
    if (i > 0 && p < 0.25) { c.fillStyle = `rgba(0,0,0,${0.85 * (1 - p / 0.25)})`; c.fillRect(0, 0, W, H); } // corte con un respiro de negro

    if (conLogo && sello) logo(c, M);
    // texto DETRÁS de la estatua: se guarda la estatua ya pintada (recortada con su máscara), va el texto y encima otra vez la estatua
    const mk = mascaras[i] && (actual || directas[i]) ? mascaras[i] : null;
    if (mk) {
      if (!capa) { capa = document.createElement("canvas"); capa.width = W; capa.height = H; }
      const x = capa.getContext("2d"); x.globalCompositeOperation = "source-over"; x.clearRect(0, 0, W, H); x.drawImage(c.canvas, 0, 0);
      x.globalCompositeOperation = "destination-in"; x.save(); camara(x, M, t, i, p, d); cubrir(x, mk, W, H); x.restore(); x.globalCompositeOperation = "source-over";
    }
    const atras = texto(c, M, t, te, mk ? { z, mk, i, p, d } : null);
    // la estatua se repinta entera desde el primer cuadro (ya trae el «respiro de negro» del corte): si se desvanecía,
    // en el primer cuarto de segundo el texto se veía pasar de adelante hacia atrás
    if (mk && atras) c.drawImage(capa, 0, 0);
  },
});

async function cuadro(M, n, k) {
  const clave = n * 100000 + k;
  if (cache.has(clave)) return cache.get(clave);
  const pr = (async () => { const r = await fetch(`/proyectos/${encodeURIComponent(M.proyecto.id)}/clips/${n}/${String(k + 1).padStart(5, "0")}.jpg`); return createImageBitmap(await r.blob()); })();
  cache.set(clave, pr); if (cache.size > 72) cache.delete(cache.keys().next().value);
  return pr;
}
function cubrir(c, img, W, H) { const s = Math.max(W / img.width, H / img.height), w = img.width * s, h = img.height * s; c.drawImage(img, (W - w) / 2, (H - h) / 2, w, h); }

// movimiento de cámara de la imagen (lo usan la imagen y su máscara, para que calcen exacto)
function camara(c, M, t, i, p, d) {
  const W = M.W, H = M.H, k = M.suave(M.clamp(p / d)), dir = i % 2 ? -1 : 1;
  // el gancho (escena 1): empujón de cámara rápido en los primeros 2 s (+28 %, con un leve giro que se endereza) y luego sigue lento.
  // Antes era un acercamiento suave de 3 s que en el celular se sentía como una foto quieta (revisión siempre en amarillo).
  const g0 = 1 - Math.pow(1 - M.clamp(t / 2), 3);
  const z = i === 0 ? 1.0 + 0.28 * g0 + 0.06 * k : 1.05 + 0.1 * k;
  c.translate(W / 2 + dir * W * 0.015 * k, H / 2 - H * 0.012 * k - (i === 0 ? H * 0.03 * (1 - g0) : 0));
  if (i === 0) c.rotate((1.2 * (1 - g0) * Math.PI) / 180);
  c.scale(z, z); c.translate(-W / 2, -H / 2);
  return z;
}
// qué parte de un rectángulo tapa la estatua (0-1), con la cámara en el instante t
function cobertura(M, prof, t, rect) {
  const W = M.W, H = M.H, sw = 72, sh = Math.round((72 * H) / W);
  if (!muestra) { muestra = document.createElement("canvas"); muestra.width = sw; muestra.height = sh; }
  const x = muestra.getContext("2d", { willReadFrequently: true }); x.setTransform(1, 0, 0, 1, 0, 0); x.clearRect(0, 0, sw, sh);
  x.save(); x.scale(sw / W, sh / H); camara(x, M, t, prof.i, t - M.tiempos.escenas[prof.i].ini, prof.d); cubrir(x, prof.mk, W, H); x.restore();
  const x0 = Math.max(0, Math.floor((rect.x / W) * sw)), x1 = Math.min(sw, Math.ceil(((rect.x + rect.w) / W) * sw));
  const y0 = Math.max(0, Math.floor((rect.y / H) * sh)), y1 = Math.min(sh, Math.ceil(((rect.y + rect.h) / H) * sh));
  if (x1 <= x0 || y1 <= y0) return 0;
  const px = x.getImageData(x0, y0, x1 - x0, y1 - y0).data; let n = 0, tap = 0;
  for (let k = 3; k < px.length; k += 4) { n++; if (px[k] > 140) tap++; } // alfa de la máscara
  return n ? tap / n : 0;
}

// gancho: una franja de luz del tono cruza la estatua en diagonal (0.1-1.8 s), como un rayo que la descubre
function barrido(c, W, H, t) {
  const k = M_clamp((t - 0.1) / 1.7); if (k <= 0 || k >= 1) return;
  const x = -W * 0.6 + W * 2.2 * (1 - Math.pow(1 - k, 2)), a = Math.sin(Math.PI * k);
  c.save(); c.globalCompositeOperation = "screen"; c.translate(x, H * 0.45); c.rotate(-0.42);
  const gr = c.createLinearGradient(-W * 0.32, 0, W * 0.32, 0);
  gr.addColorStop(0, "rgba(0,0,0,0)"); gr.addColorStop(0.5, `rgba(${rgbDe(tono)},${0.5 * a})`); gr.addColorStop(1, "rgba(0,0,0,0)");
  c.fillStyle = gr; c.fillRect(-W * 0.32, -H, W * 0.64, H * 2); c.restore();
}
const M_clamp = (v) => Math.max(0, Math.min(1, v));
const rgbDe = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16)).join(",");

// sin imagen: niebla que se mueve (para que nunca quede un hueco)
function niebla(c, M, t, i) {
  const W = M.W, H = M.H;
  for (let k = 0; k < 4; k++) {
    const a = t * (0.08 + k * 0.03) + k * 1.7 + i, x = W * (0.5 + 0.4 * Math.cos(a)), y = H * (0.5 + 0.35 * Math.sin(a * 1.2)), r = W * (0.6 + 0.15 * k);
    const gr = c.createRadialGradient(x, y, 0, x, y, r); gr.addColorStop(0, "rgba(200,200,200,0.16)"); gr.addColorStop(1, "rgba(0,0,0,0)"); c.fillStyle = gr; c.fillRect(0, 0, W, H);
  }
}

// polvo que sube y algún cuadrito de luz flotando
function polvo(c, M, t) {
  const W = M.W, H = M.H, u = M.u;
  for (let k = 0; k < 40; k++) {
    const r = M.hash(k * 3.7), q = M.hash(k * 9.1 + 2), vel = 10 + r * 25;
    const x = ((q * W + Math.sin(t * 0.4 + k) * 25 * u) % W + W) % W, y = (((r * H - t * vel * u) % H) + H) % H;
    c.globalAlpha = (0.15 + 0.35 * (0.5 + 0.5 * Math.sin(t * 1.7 + k))) * 0.8; c.fillStyle = "#e8fffb";
    c.beginPath(); c.arc(x, y, (1 + (k % 3)) * u, 0, 7); c.fill();
  }
  for (let k = 0; k < 6; k++) {
    const r = M.hash(k * 13.3 + 5), x = (r * W + t * 12 * u * (k % 2 ? 1 : -1) + W) % W, y = (((M.hash(k * 7.7) * H - t * 18 * u) % H) + H) % H, s = (8 + r * 10) * u;
    c.save(); c.translate(x, y); c.rotate(t * 0.6 + k); c.globalAlpha = 0.18 + 0.15 * Math.sin(t * 2 + k); c.fillStyle = "#dffcf6"; c.fillRect(-s / 2, -s / 2, s, s); c.restore();
  }
  c.globalAlpha = 1;
}

function logo(c, M) {
  const u = M.u, x = M.W / 2, y = M.H * (M.vertical ? 0.68 : 0.8), r = 30 * u;
  c.save(); c.globalAlpha = 0.85;
  c.beginPath(); c.arc(x, y, r, 0, 7); c.fillStyle = "rgba(0,0,0,0.35)"; c.fill();
  c.lineWidth = 2.5 * u; c.strokeStyle = "#f2f2f2"; c.stroke();
  c.beginPath(); c.arc(x, y, r - 5 * u, 0, 7); c.lineWidth = 1 * u; c.stroke();
  c.font = `800 ${28 * u}px Cinzel`; c.fillStyle = "#f2f2f2"; c.textAlign = "center"; c.textBaseline = "middle"; c.fillText(sello[0].toUpperCase(), x, y + 1 * u);
  c.restore();
}

// ---- texto palabra por palabra ----
// "bloques" (por defecto desde el 22 nov 2026) = DISCRETO, como los Shorts de estoicismo que más vistas tienen
// (Stoicus 1.7 M, The Alpha Reset Club 1.2 M, Hacia Lo Estoico, El Camino del Sabio): letra de palo gruesa (Montserrat),
// chica (~4 % del alto), 2-4 palabras, 1-2 renglones, abajo del rostro (~60 % del alto), blanca con la palabra clave en color.
// El gancho sigue grande y romano. "grande": el estilo anterior (romana grande, bloques de 3-6 palabras arriba).
// (antes) "bloques": de 3 a 6 palabras a la vez (el ojo no se adelanta), la palabra clave en color de acento
// y la palabra que se dice crece un poco al entrar. "frase": el estilo anterior (frase completa tenue hasta 16 palabras).
// La palabra clave sale de la escena (`clave`: "palabra" o ["dos","palabras"]) o, si no hay, de la palabra con más peso del bloque.
const ACENTOS = { turquesa: "#f3c66f", ambar: "#fff0c7", plata: "#e9c47c", rojo: "#f3c66f" };
const VACIAS = new Set("el la los las un una unos unas de del al a en y o u que se te tu tus su sus mi mis me lo le les es son ser fue era no ni por para con sin pero mas más como cuando donde qué quien quién ya hoy muy tan este esta estos estas ese esa eso esos esas aquel todo toda todos todas nada algo cada otro otra hay has ha han he si sí sobre entre hasta desde nos vos yo él ella ellos ellas usted ustedes tiene tienen tener hacer puede pueden porque solo sólo también aún así".split(" "));
const limpia = (w) => String(w).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-zñ0-9]/g, "");
function paginas(palabras, modo, primera) {
  const ps = []; let cur = [];
  const MAX = modo === "frase" ? 16 : modo === "discreto" ? 4 : 6;
  for (const w of palabras) {
    cur.push(w);
    const finFrase = /[.!?…]["»”]?$/.test(w.w), pausa = /[,;:—–]$/.test(w.w);
    const tope = primera && !ps.length ? 10 : MAX; // el gancho sale completo (4-9 palabras)
    if (finFrase || (modo !== "frase" && pausa && cur.length >= 3)) { ps.push(cur); cur = []; continue; }
    if (cur.length >= tope) {
      // en bloques se corta donde la frase respira: antes de una palabra de enlace (le, no, que, a…), nunca a media idea
      let j = -1;
      if (modo !== "frase" && tope === MAX) for (let k = cur.length - 2; k >= 2; k--) if (!VACIAS.has(limpia(cur[k].w)) && VACIAS.has(limpia(cur[k + 1].w))) { j = k; break; }
      if (j >= 0 && j < cur.length - 1) { ps.push(cur.slice(0, j + 1)); cur = cur.slice(j + 1); } else { ps.push(cur); cur = []; }
    }
  }
  if (cur.length) ps.push(cur);
  const MIN = modo === "frase" ? 3 : 2; // nunca queda una palabra sola en pantalla
  for (let k = 0; k < ps.length - 1; k++) if (ps[k].length < MIN && ps[k].length + ps[k + 1].length <= MAX + 1) { ps[k + 1] = [...ps[k], ...ps[k + 1]]; ps.splice(k, 1); k--; }
  if (ps.length > 1 && ps[ps.length - 1].length < MIN) ps.splice(ps.length - 2, 2, [...ps[ps.length - 2], ...ps[ps.length - 1]]);
  return ps;
}
function claves(pag, te, M) {
  const g = (M.guion.escenas || [])[M.tiempos.escenas.indexOf(te)] || {};
  const pedidas = [].concat(g.clave || []).map(limpia).filter(Boolean);
  if (pedidas.length) return new Set(pag.filter((w) => pedidas.includes(limpia(w.w))).map((w) => w.t0));
  let mejor = null, peso = 0;
  for (const w of pag) { const l = limpia(w.w); if (VACIAS.has(l) || l.length < 4) continue; if (l.length > peso) { peso = l.length; mejor = w; } }
  return new Set(mejor ? [mejor.t0] : []);
}
function texto(c, M, t, te, prof, op = {}) {
  const W = M.W, H = M.H, u = M.u;
  const sub = (M.proyecto.opciones || {}).subtitulos;
  const modo = sub === "frase" ? "frase" : sub === "grande" ? "bloques" : "discreto";
  const esPrimera = te === M.tiempos.escenas[0];
  const ps = paginas(te.palabras, modo, esPrimera); let pag = null;
  // una escena entera va detrás o entera encima: si algún bloque no cabe detrás, ninguno va detrás
  // (si no, el texto se veía brincar de atrás hacia adelante de la estatua entre un bloque y otro)
  if (prof && !op.seco && !escenasVistas.has(prof.i)) { escenasVistas.add(prof.i); ps.forEach((_, k) => texto(c, M, t, te, prof, { k, seco: true })); }
  if (op.k != null) pag = ps[op.k];
  else { for (const p of ps) if (t >= p[0].t0 - 0.05) pag = p; if (!pag && esPrimera) pag = ps[0]; }
  if (!pag) return false;
  const fin = pag[pag.length - 1].t1, siguiente = ps[ps.indexOf(pag) + 1];
  if (!op.seco && !siguiente && t > Math.max(fin + 0.9, te.finVoz + 0.6)) return false; // al final de la escena se va
  const gancho = esPrimera && pag === ps[0]; // el gancho sale COMPLETO desde el fotograma 0 (quien no te conoce decide en 1 segundo)
  const disc = modo === "discreto" && !gancho; // el gancho siempre grande y romano
  const FAM = disc ? "Montserrat" : "Cinzel";
  const ANCHO = W * (disc ? (M.vertical ? 0.76 : 0.6) : M.vertical ? 0.88 : 0.8);
  const bloques = modo !== "frase";
  let tam = (gancho ? 124 : disc ? 66 : bloques ? 118 : 100) * u; c.font = `800 ${tam}px ${FAM}`;
  const todo = pag.map((w) => w.w.toUpperCase()).join(" "), maxL = gancho ? 4 : disc ? 2 : bloques ? 3 : 5;
  while (tam > (disc ? 40 : 52) * u && M.lineas(c, todo, ANCHO).length > maxL) { tam -= 4 * u; c.font = `800 ${tam}px ${FAM}`; }
  // arma las líneas con TODAS las palabras del bloque (así nada salta de lugar al aparecer) para un tamaño y un ancho
  const armar = (tm, ancho) => {
    c.font = `800 ${tm}px ${FAM}`; const e = c.measureText(" ").width, out = []; let l = [], an = 0;
    for (const w of pag) { const s = w.w.toUpperCase(), pw = c.measureText(s).width; if (l.length && an + e + pw > ancho) { out.push({ l, ancho: an }); l = []; an = 0; } an += (l.length ? e : 0) + pw; l.push({ ...w, s, pw }); }
    if (l.length) out.push({ l, ancho: an });
    return { lineas: out, esp: e };
  };
  // columna a un lado de la cara (palabras en vertical: «LA / VERDAD / ES QUE / ¿ESTÁS DE ACUERDO?»): ancho 40 % y letra que quepa
  const COL = W * (M.vertical ? 0.42 : 0.3);
  const tamColumna = () => { c.font = `800 ${tam}px ${FAM}`; const mw = Math.max(...pag.map((w) => c.measureText(w.w.toUpperCase()).width)); let tm = mw > COL ? (tam * COL) / mw : tam; while (tm > 48 * u && armar(tm, COL).lineas.length > 6) tm -= 4 * u; return tm; };
  // x de cada línea según el acomodo: centrada, columna izquierda o derecha (con un leve escalonado, como si rodeara el rostro)
  const xDe = (modo, ln, k) => modo === "izq" ? W * 0.06 + (k % 2) * W * 0.035 : modo === "der" ? W * 0.94 - ln.ancho - (k % 2) * W * 0.035 : (W - ln.ancho) / 2;
  const base = disc ? (M.vertical ? 0.6 : 0.64) : M.vertical ? 0.3 : 0.32;
  // texto detrás: busca dónde la estatua tape un poco el texto (se ve la profundidad) sin que deje de leerse
  // opción «Acomodo del texto» = vertical: siempre en columna a un lado del rostro (palabras una bajo otra)
  const vertical = (M.proyecto.opciones || {}).acomodo === "vertical";
  let diseno = vertical ? { modo: "izq", f: 0.3, tam: tamColumna(), detras: false } : { modo: "centro", f: base, tam, detras: false };
  // discretos: chicos y abajo del rostro, siempre ENCIMA (detrás se perderían); no vetan que el gancho vaya detrás
  if (prof && disc) { if (op.seco) return true; prof = null; }
  if (prof) {
    const llave = `${prof.i}|${pag[0].t0}`;
    if (!lugares.has(llave)) {
      // se mide renglón por renglón (un renglón tapado a la mitad ya no se lee), al empezar y al terminar el bloque
      // (la cámara sigue acercándose); se permite poco: gancho ≤ 6 %, resto ≤ 12 %, ideal ~7 %.
      const tope = gancho ? 0.06 : 0.12, ideal = gancho ? 0.03 : 0.07;
      const t0 = Math.max(te.ini, pag[0].t0), t1 = Math.min(te.fin, pag[pag.length - 1].t1 + 0.9);
      const probar = (modo, tm, alturas, castigo) => {
        const { lineas: ls } = armar(tm, modo === "centro" ? ANCHO : COL), alx = tm * 1.13, alto = ls.length * alx;
        let mejor = null;
        for (const f of alturas) {
          const y = H * f; if (y - alto / 2 < H * 0.05 || y + alto / 2 > H * (disc ? 0.74 : 0.8)) continue;
          let cov = 0;
          for (const tt of [t0, t1]) ls.forEach((ln, k) => {
            cov = Math.max(cov, cobertura(M, prof, tt, { x: xDe(modo, ln, k), y: y - alto / 2 + k * alx + alx * 0.12, w: ln.ancho, h: alx * 0.76 }));
          });
          const pts = cov > tope ? -1 : (cov < 0.02 ? 0.1 : 1 - Math.abs(cov - ideal) * 4) - Math.abs(f - base) - castigo;
          if (!mejor || pts > mejor.pts) mejor = { modo, f, tam: tm, cov, pts };
        }
        return mejor;
      };
      // 1) centrado a distintas alturas; 2) si la cara tapa el centro, columna a la izquierda o a la derecha del rostro
      let mejor = vertical ? null : probar("centro", tam, [base, base - 0.06, base + 0.06, base - 0.11, base + 0.12, base - 0.15, base + 0.2], 0);
      const cols = [];
      if (!mejor || mejor.pts < 0) {
        const tc = tamColumna();
        for (const modo of ["izq", "der"]) { const r = probar(modo, tc, [0.3, 0.22, 0.38, 0.46, 0.55], vertical ? 0 : 0.15); if (r) cols.push(r); if (r && (!mejor || r.pts > mejor.pts)) mejor = r; }
      }
      // nada cabe sin taparse: va ENCIMA (centrado, o en vertical del lado que menos tape la cara si se pidió vertical)
      const menosTapado = cols.sort((a, b) => a.cov - b.cov)[0];
      lugares.set(llave, mejor && mejor.pts >= 0 ? { modo: mejor.modo, f: mejor.f, tam: mejor.tam, detras: mejor.cov >= 0.02 }
        : vertical && menosTapado ? { modo: menosTapado.modo, f: menosTapado.f, tam: menosTapado.tam, detras: false } : { ...diseno, detras: false });
    }
    diseno = lugares.get(llave);
    if (!diseno.detras) escenasEncima.add(prof.i);
    if (op.seco) return diseno.detras;
    if (escenasEncima.has(prof.i)) diseno = { ...diseno, detras: false };
    if (!diseno.detras) prof = null; // la estatua taparía demasiado en todos lados: este bloque va encima (y la estatua no se repinta)
  }
  const { lineas, esp } = armar(diseno.tam, diseno.modo === "centro" ? ANCHO : COL);
  const al = diseno.tam * 1.13, cy = H * diseno.f;
  const y0 = cy - ((lineas.length - 1) * al) / 2;
  const cxBloque = diseno.modo === "centro" ? W / 2 : lineas.reduce((s, ln, k) => s + xDe(diseno.modo, ln, k) + ln.ancho / 2, 0) / lineas.length;
  // profundidad: el texto se mueve más lento que la estatua (parallax) y flota un poco; la estatua pasa por delante
  if (prof) {
    const zt = 1 + (prof.z - 1) * 0.35, fl = Math.sin((t - te.ini) * 1.3) * 5 * u;
    c.save(); c.translate(cxBloque, cy + fl); c.scale(zt, zt); c.translate(-cxBloque, -cy);
  }
  const acento = bloques ? ACENTOS[(M.proyecto.opciones || {}).tono] || ACENTOS.turquesa : null, cl = bloques ? claves(pag, te, M) : new Set();
  // el bloque entra suave (sube 14 px y aparece en 0.18 s); el gancho ya está desde el cuadro 0
  const entra = gancho ? 1 : M.clamp((t - pag[0].t0 + 0.05) / 0.18), sube = bloques ? (1 - M.suave(entra)) * 14 * u : 0;
  // gancho: ya se lee en el cuadro 0, pero llega con un golpe (de 112 % a 100 % en 0.45 s) y cada palabra se enciende al decirse
  const golpe = gancho ? 1 + 0.12 * Math.pow(1 - M.clamp(t / 0.45), 3) : 1;
  if (golpe !== 1) { c.save(); c.translate(cxBloque, cy); c.scale(golpe, golpe); c.translate(-cxBloque, -cy); }
  c.textBaseline = "middle"; c.textAlign = "left";
  lineas.forEach((ln, k) => {
    let x = xDe(diseno.modo, ln, k); const y = y0 + k * al + sube;
    for (const w of ln.l) {
      const a = M.clamp((t - w.t0) / (bloques ? 0.2 : 0.35)); // tenue → se enciende cuando se dice (también en el gancho)
      const esClave = cl.has(w.t0);
      // la palabra que se dice crece 5 % y regresa en 0.3 s (sin rebotes: que se note sin romper la calma)
      const z = bloques ? 1 + 0.05 * Math.max(0, 1 - Math.abs((t - w.t0) / 0.3 - 0.35) / 0.65) * (t >= w.t0 ? 1 : 0) : 1;
      const gris = Math.round((gancho ? 200 : disc ? 225 : bloques ? 190 : 165) + (gancho ? 55 : disc ? 30 : bloques ? 65 : 90) * a); // en bloques lo que falta por decirse se lee bien (solo más tenue)
      c.save();
      c.translate(x + w.pw / 2, y); c.scale(z, z); c.translate(-(x + w.pw / 2), -y);
      c.shadowColor = "rgba(0,0,0,0.85)"; c.shadowBlur = 14 * u; c.shadowOffsetY = 3 * u; c.globalAlpha = (gancho ? 0.85 + 0.15 * a : 0.5 + 0.5 * a) * entra; // el gancho se lee completo aunque falte decirlo
      c.lineJoin = "round"; c.lineWidth = (disc ? 6 : 9) * u; c.strokeStyle = "rgba(0,0,0,0.9)"; c.strokeText(w.s, x, y); // contorno negro: se lee con el brillo bajo
      c.fillStyle = esClave && a > 0 ? mezcla(`rgb(${gris},${gris},${gris})`, acento, a) : `rgb(${gris},${gris},${gris})`; c.fillText(w.s, x, y);
      if (a > 0.3 && (!disc || esClave)) { c.shadowColor = esClave ? acento : `rgba(255,255,255,${0.55 * a})`; c.shadowBlur = (esClave ? (disc ? 16 : 28) : 22) * u; c.shadowOffsetY = 0; c.globalAlpha = (esClave ? 0.9 : 1) * entra; c.fillText(w.s, x, y); }
      c.restore();
      x += w.pw + esp;
    }
  });
  if (golpe !== 1) c.restore();
  if (prof) c.restore();
  c.textAlign = "center";
  return !!prof; // true = va detrás: la estatua se vuelve a pintar encima
}
function mezcla(a, b, k) { // de un rgb(...) a un #hex
  const A = a.match(/\d+/g).map(Number), B = [1, 3, 5].map((i) => parseInt(b.slice(i, i + 2), 16));
  return `rgb(${A.map((v, i) => Math.round(v + (B[i] - v) * k)).join(",")})`;
}
</script>
