<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Frases · Fondo desenfocado</title>
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block;width:100vw;height:100vh;object-fit:contain}</style>
</head><body><canvas id="lienzo"></canvas>
<script src="../_comun/motor.js"></script>
<script>
const F = "../_comun/fuentes/";
const TEMAS = {
  noche:   { texto: "#f6f2ea", acento: "#e9c58f", velo: "rgba(8,10,18,0.48)",   blobs: ["#1b2a4a", "#3a2350", "#0f3a45"], base: "#070910", sombra: "rgba(0,0,0,0.55)" },
  calido:  { texto: "#fbf3e6", acento: "#f3b48f", velo: "rgba(40,22,12,0.42)",  blobs: ["#7a3d22", "#a8643a", "#4a2a3a"], base: "#1a0f0a", sombra: "rgba(0,0,0,0.5)" },
  levania: { texto: "#3d3230", acento: "#b86f65", velo: "rgba(246,238,228,0.40)", blobs: ["#e2ada0", "#a9c2a2", "#f0cfb6"], base: "#f6eee4", sombra: "rgba(246,238,228,0.0)" },
  claro:   { texto: "#1f2328", acento: "#8a6a3a", velo: "rgba(255,255,255,0.40)", blobs: ["#c9d8e8", "#ecd3c0", "#cfe5d4"], base: "#f4f4f2", sombra: "rgba(255,255,255,0)" },
};
let TEMA, LETRA, fondo = { tipo: "degradado" }, cache = new Map(), actual = null, grano, acentos = [];

Motor.iniciar({
  fuentes: [
    ["Cormorant", F + "cormorant-garamond-latin-500-normal.woff2", { weight: "500" }],
    ["Cormorant", F + "cormorant-garamond-latin-600-normal.woff2", { weight: "600" }],
    ["Cormorant", F + "cormorant-garamond-latin-500-italic.woff2", { weight: "500", style: "italic" }],
    ["Cormorant", F + "cormorant-garamond-latin-600-italic.woff2", { weight: "600", style: "italic" }],
    ["Jost", F + "jost-latin-400-normal.woff2", { weight: "400" }],
    ["Jost", F + "jost-latin-500-normal.woff2", { weight: "500" }],
  ],
  async preparar(M) {
    const op = M.proyecto.opciones || {};
    TEMA = TEMAS[op.tema] || TEMAS.noche;
    LETRA = op.letra === "moderna" ? "Jost" : "Cormorant";
    grano = M.grano(4, 256);
    const r = await fetch(`/proyectos/${encodeURIComponent(M.proyecto.id)}/fondo.json?v=${Date.now()}`);
    if (r.ok) fondo = await r.json();
    // palabras destacadas: las que en el texto van entre *asteriscos*
    acentos = M.guion.escenas.map((e) => {
      const tok = (e.texto || "").split(/\s+/).filter(Boolean);
      let dentro = false;
      return tok.map((w) => { const ini = w.startsWith("*"), fin = /\*[.,;:!?…"”»)]*$/.test(w); const a = dentro || ini; if (ini) dentro = true; if (fin) dentro = false; return a; });
    });
    M.antesDeDibujar = async (t) => {
      if (fondo.tipo === "degradado" || !fondo.frames) return;
      const k = fondo.tipo === "video" ? (Math.floor(t * fondo.fps) % fondo.frames) : 0;
      actual = await cuadro(M, k);
      // adelanta los siguientes para que el render no espere
      if (fondo.tipo === "video") for (let j = 1; j <= 3; j++) cuadro(M, (k + j) % fondo.frames);
    };
  },

  dibujar(c, t, M) {
    const W = M.W, H = M.H;
    // ---- fondo ----
    c.fillStyle = TEMA.base; c.fillRect(0, 0, W, H);
    const zoom = 1.04 + 0.05 * (t / M.duracion);
    if (actual) {
      const k = Math.max(W / actual.width, H / actual.height) * zoom;
      const w = actual.width * k, h = actual.height * k;
      c.drawImage(actual, (W - w) / 2, (H - h) / 2, w, h);
    } else degradado(c, M, t);
    c.fillStyle = TEMA.velo; c.fillRect(0, 0, W, H);
    const vg = c.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.3, W / 2, H / 2, Math.max(W, H) * 0.75);
    vg.addColorStop(0, "rgba(0,0,0,0)"); vg.addColorStop(1, TEMA === TEMAS.levania || TEMA === TEMAS.claro ? "rgba(120,90,70,0.18)" : "rgba(0,0,0,0.45)");
    c.fillStyle = vg; c.fillRect(0, 0, W, H);

    // ---- texto ----
    const i = M.escenaEn(t), e = M.guion.escenas[i], te = M.tiempos.escenas[i];
    const sigAutor = M.guion.escenas[i + 1]?.tipo === "autor" && e.tipo !== "autor";
    const entra = M.clamp((t - te.ini + 0.1) / 0.5), sale = sigAutor ? 1 : M.clamp((te.fin - t) / 0.4);
    c.save(); c.globalAlpha = Math.min(entra, sale);
    if (e.tipo === "autor") autor(c, M, t, e, te, i);
    else if (e.tipo === "cierre") cierre(c, M, t, e, te, i);
    else frase(c, M, t, e, te, i);
    c.restore();
    // autor pegado a la frase anterior: si la escena anterior fue frase y esta es autor, la frase se queda tenue
    if (e.tipo === "autor" && i > 0 && M.guion.escenas[i - 1].tipo !== "autor") {
      c.save(); c.globalAlpha = sale; frase(c, M, Infinity, M.guion.escenas[i - 1], M.tiempos.escenas[i - 1], i - 1, true); c.restore();
    }

    // marca
    const marca = M.proyecto.canal || M.guion.canal;
    if (marca) { c.font = `400 ${28 * M.u}px Jost`; c.textAlign = "center"; c.fillStyle = TEMA.texto; c.globalAlpha = 0.55; c.fillText(marca, W / 2, H - (M.vertical ? 150 : 60) * M.u); c.globalAlpha = 1; }
    // grano muy suave
    c.globalAlpha = 0.035; c.globalCompositeOperation = "overlay";
    const g = grano[Math.floor(t * 12) % grano.length]; for (let y = 0; y < H; y += 512) for (let x = 0; x < W; x += 512) c.drawImage(g, x, y, 512, 512);
    c.globalCompositeOperation = "source-over"; c.globalAlpha = 1;
    const neg = Math.max(M.clamp(1 - t / 0.7), M.clamp((t - (M.duracion - 1.4)) / 1.2));
    if (neg > 0) { c.fillStyle = `rgba(0,0,0,${neg})`; c.fillRect(0, 0, W, H); }
  },
});

async function cuadro(M, k) {
  if (cache.has(k)) return cache.get(k);
  const p = (async () => {
    const r = await fetch(`/proyectos/${encodeURIComponent(M.proyecto.id)}/fondo/${String(k + 1).padStart(5, "0")}.jpg`);
    return createImageBitmap(await r.blob());
  })();
  cache.set(k, p);
  if (cache.size > 48) { const viejo = cache.keys().next().value; cache.delete(viejo); }
  return p;
}

function degradado(c, M, t) {
  const W = M.W, H = M.H;
  TEMA.blobs.forEach((col, j) => {
    const x = W * (0.5 + 0.35 * Math.sin(t * 0.09 + j * 2.1)), y = H * (0.5 + 0.3 * Math.cos(t * 0.07 + j * 1.7));
    const r = Math.max(W, H) * (0.55 + 0.1 * Math.sin(t * 0.13 + j));
    const g = c.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, col); g.addColorStop(1, col + "00");
    c.fillStyle = g; c.fillRect(0, 0, W, H);
  });
}

// acomoda palabras en líneas y busca un tamaño que quepa
function acomodar(c, palabras, ancho, altoMax, tamIni, peso, fam) {
  for (let tam = tamIni; tam > 30; tam -= 4) {
    const esp = (() => { c.font = `${peso} ${tam}px ${fam}`; return c.measureText(" ").width; })();
    const lineas = []; let l = [], w = 0;
    for (const p of palabras) {
      c.font = `${p.acento ? "italic " : ""}${peso} ${tam}px ${fam}`;
      const pw = c.measureText(p.txt).width;
      if (l.length && w + esp + pw > ancho) { lineas.push({ l, w }); l = []; w = 0; }
      w += (l.length ? esp : 0) + pw; l.push({ ...p, pw });
    }
    if (l.length) lineas.push({ l, w });
    if (lineas.length * tam * 1.2 <= altoMax) return { lineas, tam, esp };
  }
}

function frase(c, M, t, e, te, i, quieta = false) {
  const V = M.vertical, W = M.W, H = M.H;
  const pal = te.palabras.map((p, j) => ({ ...p, txt: p.w, acento: acentos[i]?.[j] && te.palabras.length === acentos[i].length }));
  if (!pal.length) return;
  const peso = LETRA === "Jost" ? 500 : 500;
  const caja = acomodar(c, pal, V ? W * 0.8 : W * 0.66, V ? H * 0.42 : H * 0.56, (V ? 108 : 100) * M.u * (LETRA === "Jost" ? 0.82 : 1), peso, LETRA);
  if (!caja) return;
  const { lineas, tam, esp } = caja, alto = tam * 1.2;
  const yC = V ? H * 0.45 : H * 0.48, y0 = yC - ((lineas.length - 1) * alto) / 2 + tam * 0.3;
  // comillas decorativas
  if (e.comillas !== false && LETRA === "Cormorant") { c.font = `600 ${tam * 2.2}px Cormorant`; c.textAlign = "center"; c.fillStyle = TEMA.acento; const ga = c.globalAlpha; c.globalAlpha = ga * 0.55; c.fillText("“", W / 2, y0 - tam * 0.95); c.globalAlpha = ga; }
  c.textAlign = "left"; c.textBaseline = "alphabetic";
  c.shadowColor = TEMA.sombra; c.shadowBlur = 24 * M.u;
  const base = c.globalAlpha;
  lineas.forEach((ln, k) => {
    let x = (W - ln.w) / 2;
    for (const p of ln.l) {
      const a = quieta ? 1 : M.clamp((t - p.t0 + 0.15) / 0.45);
      if (a > 0) {
        c.globalAlpha = base * M.salida(a);
        c.font = `${p.acento ? "italic " : ""}${peso} ${tam}px ${LETRA}`;
        c.fillStyle = p.acento ? TEMA.acento : TEMA.texto;
        c.fillText(p.txt, x, y0 + k * alto + (1 - M.salida(a)) * 18 * M.u);
      }
      x += p.pw + esp;
    }
  });
  c.shadowBlur = 0; c.globalAlpha = base;
}

function autor(c, M, t, e, te) {
  const V = M.vertical, W = M.W, H = M.H;
  const txt = (e.texto || "").replace(/[*_]/g, "").replace(/^[—–-]\s*/, "");
  const a = M.salida((t - te.ini) / 0.8);
  c.font = `500 ${(V ? 36 : 32) * M.u}px Jost`; c.textAlign = "center"; c.fillStyle = TEMA.acento;
  c.globalAlpha *= a;
  const y = V ? H * 0.68 : H * 0.8;
  if (c.letterSpacing !== undefined) c.letterSpacing = `${6 * M.u}px`;
  c.fillText(txt.toUpperCase(), W / 2, y);
  if (c.letterSpacing !== undefined) c.letterSpacing = "0px";
  c.fillRect(W / 2 - 40 * M.u * a, y - 70 * M.u, 80 * M.u * a, 2 * M.u);
}

function cierre(c, M, t, e, te, i) {
  const V = M.vertical, W = M.W, H = M.H;
  const pal = te.palabras.map((p) => ({ ...p, txt: p.w }));
  const caja = acomodar(c, pal, V ? W * 0.78 : W * 0.6, H * 0.3, (V ? 60 : 54) * M.u, 400, "Jost");
  if (!caja) return;
  const { lineas, tam, esp } = caja, alto = tam * 1.3, y0 = H * 0.5 - ((lineas.length - 1) * alto) / 2;
  c.textAlign = "left"; c.fillStyle = TEMA.texto; const base = c.globalAlpha;
  lineas.forEach((ln, k) => { let x = (W - ln.w) / 2; for (const p of ln.l) { c.globalAlpha = base * M.clamp((t - p.t0 + 0.15) / 0.4); c.font = `400 ${tam}px Jost`; c.fillText(p.txt, x, y0 + k * alto); x += p.pw + esp; } });
  c.globalAlpha = base;
}
</script>
</body></html>
